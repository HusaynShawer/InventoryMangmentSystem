services:
  api:
    build: .
    restart: on-failure
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=InventoryMangmentSystemDb;User Id=sa;Password=HussienSqlServer!;TrustServerCertificate=True"
    networks:
      - inventory_net

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - inventory_net

networks:
  inventory_net:
    name: inventory_net
    external: true
